<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">Pomodoro</h1>
      <a class="btn-settings" href="setting.html" aria-label="설정">&#9881;</a>
    </header>

    <main class="main">
      <div class="timer-display">
        <span class="timer-time">25:00</span>
        <span class="timer-label">집중 시간</span>
      </div>

      <div class="controls">
        <button class="btn btn-start">시작</button>
        <button class="btn btn-stop">정지</button>
        <button class="btn btn-reset">초기화</button>
      </div>
    </main>
  </div>
  <script src="index.js"></script>
</body>
</html>
